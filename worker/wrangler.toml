name = "relay-telegram-setup"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[observability]
enabled = true
head_sampling_rate = 1

# Pairing state is strongly consistent via Durable Objects (KV's 60s edge
# cache made "ready" invisible to the relay's polls for up to a minute).
[[durable_objects.bindings]]
name = "PAIRING"
class_name = "PairingObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PairingObject"]

[vars]
# Username of your manager bot, without the @ (see README).
MANAGER_BOT_USERNAME = "assistantmanagercody_bot"

[[kv_namespaces]]
binding = "PAIRINGS"
id = "e70d629c3ae04d20887e6c5217ca508e"
